name: Bug report
description: Report a reproducible issue
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Never include access tokens, passwords, or private customer data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit SHA or version
