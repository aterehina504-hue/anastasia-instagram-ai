services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: instagram_ai
      POSTGRES_USER: instagram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instagram -d instagram_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://instagram:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/instagram_ai
      MEDIA_DIR: /data/media
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - instagram_media:/data/media
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  instagram_media:
  caddy_data:
  caddy_config:
